<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #18181b; }
    .letter { fill: #fafafa; font-family: 'IBM Plex Mono', monospace, sans-serif; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #fafafa; }
      .letter { fill: #18181b; }
    }
  </style>

  <!-- Letter/initial mark: rounded-square badge with a bold monospace initial. -->
  <rect class="bg" x="2" y="2" width="28" height="28" rx="8" />
  <text class="letter" x="16" y="16" font-size="18" text-anchor="middle" dominant-baseline="central">R</text>
</svg>